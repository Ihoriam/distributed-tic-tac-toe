<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 8px;
            background: #333;
            padding: 8px;
            border-radius: 12px;
            margin: 0 auto 30px;
            width: fit-content;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .cell.x {
            color: #1976d2;
            background: #e3f2fd;
        }

        .cell.o {
            color: #d32f2f;
            background: #ffebee;
        }

        .cell.pop {
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        .controls {
            margin-bottom: 20px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .speed-control label {
            color: #666;
            font-size: 14px;
        }

        .speed-control input[type="range"] {
            width: 200px;
            cursor: pointer;
        }

        .speed-control input[type="range"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .speed-value {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .start-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .start-btn.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            margin-top: 20px;
            font-size: 18px;
            color: #666;
            min-height: 30px;
        }

        .status.winner {
            font-weight: bold;
            color: #4CAF50;
            font-size: 22px;
        }

        .status.error {
            color: #d32f2f;
        }

        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            background: #ffeb3b;
            color: #333;
        }

        .connection-status.connected {
            background: #4CAF50;
            color: white;
        }

        .connection-status.disconnected {
            background: #f44336;
            color: white;
        }

        .move-history {
            margin-top: 20px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
        }

        .move-history h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
            text-align: center;
        }

        .move-history ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .move-history li {
            padding: 5px 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }

        .move-history li:last-child {
            border-bottom: none;
        }

        .move-history li.x-move {
            border-left: 3px solid #1976d2;
        }

        .move-history li.o-move {
            border-left: 3px solid #d32f2f;
        }

        .move-history .empty-message {
            text-align: center;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="connection-status" id="connectionStatus">Connecting...</div>

<div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
        <div class="speed-control">
            <label>Slow</label>
            <input id="speedSlider" max="100" min="0" type="range" value="50">
            <label>Fast</label>
        </div>
        <div class="speed-value" id="speedValue">Speed: Normal (500ms)</div>
    </div>

    <button class="start-btn" id="startBtn">
        <span class="spinner"></span>
        <span class="btn-text">Start Game</span>
    </button>

    <div class="status" id="status">Click 'Start Game' to begin</div>

    <div class="move-history" id="moveHistory">
        <h3>Move History</h3>
        <ul id="moveList">
            <li class="empty-message">No moves yet</li>
        </ul>
    </div>
</div>

<script src="/webjars/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="/webjars/stomp-websocket/2.3.4/stomp.min.js"></script>
<script th:inline="javascript">
    const SESSION_API_URL = /*[[${sessionApiUrl}]]*/ 'http://localhost:8082';
    const WS_URL = /*[[${wsUrl}]]*/ 'http://localhost:8082/ws';

    let stompClient = null;
    let currentSessionId = null;
    let subscription = null;
    let gameInProgress = false;

    const cells = document.querySelectorAll('.cell');
    const startBtn = document.getElementById('startBtn');
    const btnText = startBtn.querySelector('.btn-text');
    const statusEl = document.getElementById('status');
    const speedSlider = document.getElementById('speedSlider');
    const speedValueEl = document.getElementById('speedValue');
    const connectionStatusEl = document.getElementById('connectionStatus');
    const moveListEl = document.getElementById('moveList');

    function getDelayMs() {
        const value = parseInt(speedSlider.value);
        return 2000 - (value * 19);
    }

    function getSpeedLabel(value) {
        if (value <= 25) return 'Slow';
        if (value <= 75) return 'Normal';
        return 'Fast';
    }

    speedSlider.addEventListener('input', () => {
        const value = parseInt(speedSlider.value);
        const delayMs = getDelayMs();
        const label = getSpeedLabel(value);
        speedValueEl.textContent = `Speed: ${label} (${delayMs}ms)`;
    });

    function setGameInProgress(inProgress) {
        gameInProgress = inProgress;
        speedSlider.disabled = inProgress;
    }

    function setLoading(loading) {
        if (loading) {
            startBtn.classList.add('loading');
            startBtn.disabled = true;
        } else {
            startBtn.classList.remove('loading');
        }
    }

    function connectWebSocket() {
        const socket = new SockJS(WS_URL);
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // Disable debug logs

        stompClient.connect({},
            function (frame) {
                connectionStatusEl.textContent = 'Connected';
                connectionStatusEl.className = 'connection-status connected';

                // Re-subscribe to current session if there was one
                if (currentSessionId && gameInProgress) {
                    subscription = stompClient.subscribe(
                        `/topic/session/${currentSessionId}`,
                        handleMoveUpdate
                    );
                }
            },
            function (error) {
                connectionStatusEl.textContent = 'Disconnected';
                connectionStatusEl.className = 'connection-status disconnected';
                setTimeout(connectWebSocket, 3000);
            }
        );
    }

    function resetBoard() {
        cells.forEach(cell => {
            cell.textContent = '';
            cell.className = 'cell';
        });
    }

    function syncBoard(boardArray) {
        if (!boardArray || boardArray.length !== 9) return;
        cells.forEach((cell, index) => {
            const value = boardArray[index];
            cell.textContent = value || '';
            cell.className = 'cell';
            if (value === 'X') cell.classList.add('x');
            else if (value === 'O') cell.classList.add('o');
        });
    }

    function updateCell(row, col, player) {
        const index = row * 3 + col;
        const cell = cells[index];
        if (cell && player) {
            cell.textContent = player;
            cell.classList.add(player.toLowerCase());
            cell.classList.add('pop');
            setTimeout(() => cell.classList.remove('pop'), 300);
        }
    }

    function clearMoveHistory() {
        moveListEl.innerHTML = '<li class="empty-message">No moves yet</li>';
    }

    function addMoveToHistory(moveNumber, player, row, col) {
        // Remove empty message if present
        const emptyMsg = moveListEl.querySelector('.empty-message');
        if (emptyMsg) {
            emptyMsg.remove();
        }

        const li = document.createElement('li');
        li.className = player === 'X' ? 'x-move' : 'o-move';
        li.textContent = `${moveNumber}. ${player} at (${row}, ${col})`;
        moveListEl.appendChild(li);

        // Scroll to bottom
        moveListEl.scrollTop = moveListEl.scrollHeight;
    }

    function handleMoveUpdate(message) {
        const data = JSON.parse(message.body);

        // Always update cell first if valid move data is present
        if (data.row >= 0 && data.col >= 0 && data.player) {
            updateCell(data.row, data.col, data.player);
            addMoveToHistory(data.moveNumber, data.player, data.row, data.col);
        }

        if (data.isComplete) {
            statusEl.textContent = data.message + ' (Total moves: ' + data.moveNumber + ')';
            statusEl.className = 'status winner';
            startBtn.disabled = false;
            btnText.textContent = 'Play Again';
            setGameInProgress(false);
        } else {
            statusEl.textContent = `Move ${data.moveNumber}: ${data.player} at (${data.row}, ${data.col})`;
            statusEl.className = 'status';
        }
    }

    async function startGame() {
        setLoading(true);
        setGameInProgress(true);
        resetBoard();
        clearMoveHistory();
        statusEl.textContent = 'Creating game session...';
        statusEl.className = 'status';

        try {
            // Unsubscribe from previous session
            if (subscription) {
                subscription.unsubscribe();
            }

            // Create new session
            const response = await fetch(`${SESSION_API_URL}/sessions`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            });

            if (!response.ok) {
                throw new Error('Failed to create session');
            }

            const session = await response.json();
            currentSessionId = session.sessionId;
            statusEl.textContent = `Game started! Session: ${currentSessionId}`;

            // Subscribe to session updates
            if (stompClient && stompClient.connected) {
                subscription = stompClient.subscribe(
                    `/topic/session/${currentSessionId}`,
                    handleMoveUpdate
                );

                // Start async simulation
                const delayMs = getDelayMs();
                await fetch(`${SESSION_API_URL}/sessions/${currentSessionId}/simulate-async?delayMs=${delayMs}`, {
                    method: 'POST'
                });

                setLoading(false);
            } else {
                statusEl.textContent = 'WebSocket not connected. Please refresh the page.';
                statusEl.className = 'status error';
                startBtn.disabled = false;
                setLoading(false);
                setGameInProgress(false);
            }
        } catch (error) {
            statusEl.textContent = 'Error: ' + error.message;
            statusEl.className = 'status error';
            startBtn.disabled = false;
            setLoading(false);
            setGameInProgress(false);
        }
    }

    startBtn.addEventListener('click', startGame);

    // Connect on page load
    connectWebSocket();
</script>
</body>
</html>
